<main id="main" class="wrap" style="padding-top:26px">

  <p class="fig" style="margin-bottom:6px"><b>Fig. 07</b> · Table des concours</p>
  <h1 style="margin:0 0 6px;font-size:1.5rem">
    <span data-i18n="con.title">竞赛指南</span>
    <span class="dim" style="font-family:var(--serif);font-size:1rem;font-weight:400" data-i18n="con.h1fr"> · Concours</span>
  </h1>
  <p class="muted small" style="margin:0 0 20px;max-width:80ch" data-i18n="con.lede"></p>

  <div class="library-bar contest-bar">
    <div class="field span-2">
      <label for="con-search" data-i18n="con.searchLabel">关键词</label>
      <input type="search" id="con-search" autocomplete="off" data-i18n-placeholder="con.search">
    </div>
    <div class="field">
      <label for="con-stage" data-i18n="con.stage">适合年级</label>
      <select id="con-stage"></select>
    </div>
    <div class="field">
      <label for="con-level" data-i18n="con.levelLabel">难度</label>
      <select id="con-level"></select>
    </div>
    <div class="field">
      <label for="con-sort" data-i18n="con.sortBy">排序</label>
      <select id="con-sort"></select>
    </div>
  </div>

  <div class="cat-strip" id="con-cats" style="margin:16px 0 10px"></div>

  <div class="row row-between contest-actions" style="margin-bottom:14px">
    <span class="lib-count" id="con-count"></span>
    <div class="row" style="gap:8px">
      <button type="button" class="btn btn-sm btn-ghost contest-stars-btn" id="con-stars" aria-pressed="false"></button>
      <button type="button" class="btn btn-sm btn-ghost" id="con-clear" data-i18n="con.clearFilter">清空筛选</button>
    </div>
  </div>

  <div class="contest-grid" id="con-grid"></div>

  <section style="margin:38px 0 0">
    <div class="section-head">
      <div>

      <span class="spacer"></span>
      <p data-i18n="con.yearsLede"></p>
    </div>
    <div class="year-grid" id="con-years"></div>
  </section>

  <section style="margin:38px 0 0">
    <div class="section-head">
      <div>
        <p class="fig"><b>Fig. 09</b> · Parcours</p>
        <h2 data-i18n="con.pathsTitle">选赛路线</h2>

      <p data-i18n="con.pathsLede"></p>

  <section style="margin:38px 0 0">

      <div>

      <p data-i18n="con.guidesLede"></p>
